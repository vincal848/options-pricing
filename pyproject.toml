[project]
name = "options-pricing"
version = "1.0.0"
description = "European and American option pricing by analytic, binomial-tree and Crank-Nicolson methods, cross-validated against each other"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Caleb Vinson" }]
readme = "README.md"
keywords = ["options", "black-scholes", "binomial", "finite-difference", "greeks", "quantitative-finance"]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
options = "options_pricing.cli:app"

[project.urls]
Homepage = "https://github.com/vincal848/options_pricing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/options_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --doctest-modules"
